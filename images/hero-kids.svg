    <radialGradient id="sun" cx=".8" cy=".15" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6b4f"/><stop offset="1" stop-color="#1f4d38"/></linearGradient>
  </defs>
  <rect width="800" height="550" fill="url(#wall)"/>
  <rect width="800" height="550" fill="url(#sun)"/>
