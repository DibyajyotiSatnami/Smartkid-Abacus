      <ellipse cx="120" cy="48" rx="15" ry="7" fill="#8b5cf6"/><ellipse cx="120" cy="57" rx="15" ry="7" fill="#8b5cf6"/><ellipse cx="120" cy="79" rx="15" ry="7" fill="#8b5cf6"/>
      <ellipse cx="160" cy="52" rx="15" ry="7" fill="#2563eb"/><ellipse cx="160" cy="70" rx="15" ry="7" fill="#2563eb"/><ellipse cx="160" cy="79" rx="15" ry="7" fill="#2563eb"/>
      <ellipse cx="200" cy="48" rx="15" ry="7" fill="#22c55e"/><ellipse cx="200" cy="57" rx="15" ry="7" fill="#22c55e"/><ellipse cx="200" cy="66" rx="15" ry="7" fill="#22c55e"/>
      <ellipse cx="240" cy="61" rx="15" ry="7" fill="#ffb020"/><ellipse cx="240" cy="70" rx="15" ry="7" fill="#ffb020"/><ellipse cx="240" cy="79" rx="15" ry="7" fill="#ffb020"/>
